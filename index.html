<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>Rock Shooter</title>
<style>
:root{--bg:#080b10;--glass:rgba(10,14,20,.68);--line:rgba(255,255,255,.14);--text:#f7f9fc;--muted:#aeb8c7;--accent:#ff563d;--good:#55e38c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;z-index:10;pointer-events:none}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.panel{background:linear-gradient(180deg,rgba(18,23,31,.78),rgba(8,11,16,.64));border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;box-shadow:0 14px 40px #0005,inset 0 1px #fff1}.status{width:min(310px,68vw);padding:11px 13px}.stats{display:flex;gap:clamp(9px,2vw,18px);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.stats b{display:block;color:var(--text);font-size:18px;line-height:1.1;letter-spacing:0;margin-top:3px}.hp-track{height:6px;margin-top:9px;border-radius:99px;background:#fff1;overflow:hidden}.hp-fill{height:100%;width:100%;border-radius:99px;background:var(--good);transition:width .25s,background .25s}.actions{display:flex;gap:8px;pointer-events:auto}.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:15px;background:var(--glass);color:#fff;font-size:18px;transition:transform .14s}.icon:active{transform:scale(.92)}.crosshair{position:fixed;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);border:1.5px solid #fffb;border-radius:50%;z-index:4;pointer-events:none;transition:.12s}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#fff9}.crosshair:before{width:5px;height:1px;left:50%;top:50%;transform:translate(-50%,-50%)}.crosshair:after{width:1px;height:5px;left:50%;top:50%;transform:translate(-50%,-50%)}.crosshair.hit{width:43px;height:43px;border-color:#ff6b55}.bottom{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.left-stack{min-width:0;display:flex;flex-direction:column;gap:9px;align-items:flex-start}.weapons{display:flex;gap:7px;max-width:min(70vw,520px);overflow-x:auto;padding:7px;pointer-events:auto;scrollbar-width:none}.weapons::-webkit-scrollbar{display:none}.weapon{flex:0 0 60px;height:64px;border:1px solid var(--line);border-radius:17px;background:#fff0d;color:var(--muted);font:700 9px/1.1 inherit;letter-spacing:.04em;transition:transform .18s,background .18s,border-color .18s,color .18s}.weapon strong{display:block;font-size:21px;margin-bottom:4px}.weapon.active{transform:translateY(-4px) scale(1.03);background:#fff2;border-color:#fff6;color:#fff;box-shadow:0 12px 25px #0004,0 0 22px #fff1}.move{display:flex;gap:8px;pointer-events:auto}.move button{width:58px;height:54px;border:1px solid #fff2;border-radius:18px;background:#0c1016b0;color:#fff;font-size:26px;backdrop-filter:blur(15px);transition:.12s}.move button:active{transform:scale(.9);background:#fff3}.fire-wrap{position:relative}.fire-ring{position:absolute;inset:-7px;border:1px solid #ff5b4345;border-radius:50%;animation:pulse 1.8s ease-in-out infinite;pointer-events:none}#fire{pointer-events:auto;width:96px;height:96px;border-radius:50%;border:2px solid #fffd;background:radial-gradient(circle at 34% 28%,#ff8066,#ff4b32 35%,#a8170a 78%);color:#fff;font:900 14px inherit;letter-spacing:.08em;box-shadow:0 0 0 7px #ff563d12,0 15px 42px #ff3d2659,inset 0 -10px 22px #0005;transition:.1s}#fire:active{transform:scale(.9);filter:brightness(1.15)}.center{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:#040609c7;backdrop-filter:blur(20px);padding:24px;text-align:center}.card{width:min(440px,100%);padding:34px 28px 28px;border-radius:30px;background:linear-gradient(145deg,#161c26f0,#090c11f0);border:1px solid #fff2;box-shadow:0 35px 100px #0009,inset 0 1px #fff1;animation:cardIn .35s ease-out}.logo{width:58px;height:58px;margin:0 auto 17px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(145deg,#fff,#bbc5d0);color:#090c11;font-size:27px}.eyebrow{margin:9px 0 0;color:#ff7b66;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.card h1{margin:0;font-size:clamp(31px,8vw,42px);letter-spacing:-.045em}.card p{margin:13px auto 24px;max-width:330px;color:var(--muted);line-height:1.55;font-size:14px}.primary{min-width:170px;border:0;border-radius:16px;padding:15px 23px;background:#f7f9fc;color:#080b10;font:800 14px inherit;transition:.14s}.primary:active{transform:scale(.96)}.hint{margin:16px 0 0!important;font-size:11px!important}.hidden{display:none!important}.toast{position:fixed;left:50%;top:max(76px,calc(env(safe-area-inset-top) + 62px));transform:translate(-50%,-8px);z-index:40;padding:9px 14px;border-radius:13px;background:#0e131be8;border:1px solid var(--line);backdrop-filter:blur(14px);font-size:12px;font-weight:700;opacity:0;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}.damage{position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(circle,transparent 48%,#ff1e142f);opacity:0}.damage.show{animation:damage .38s ease-out}.paused-badge{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;padding:14px 20px;border-radius:18px;background:#080b10c7;border:1px solid var(--line);backdrop-filter:blur(18px);font-weight:800;letter-spacing:.12em;font-size:12px;pointer-events:none;opacity:0;transition:.2s}.paused-badge.show{opacity:1}@keyframes pulse{0%,100%{transform:scale(.92);opacity:.2}50%{transform:scale(1.08);opacity:.7}}@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}@keyframes damage{0%{opacity:0}25%{opacity:1}100%{opacity:0}}@media(max-width:600px){.status{width:calc(100vw - 112px);padding:9px 11px}.stats{gap:8px}.stats b{font-size:16px}.icon{width:40px;height:40px}.weapons{max-width:59vw}.weapon{flex-basis:52px;height:58px}.move button{width:54px;height:50px}#fire{width:86px;height:86px}.card{padding:30px 22px 24px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
</head>
<body>
<div id="start" class="center"><div class="card"><div class="logo">✦</div><div class="eyebrow">Rock Arcade</div><h1>Rock Shooter</h1><p>Fast mobile-first 3D action. Break the wall, clear enemy waves and master five weapons.</p><button id="play" class="primary">PLAY GAME</button><p class="hint">Drag the world to aim · Hold ← / → to move</p></div></div>
<div id="over" class="center hidden"><div class="card"><div class="logo">×</div><div class="eyebrow">Run ended</div><h1>Game Over</h1><p id="final">Score 0 · Wave 1</p><button id="restart" class="primary">PLAY AGAIN</button></div></div>
<div class="hud"><div class="top"><div class="panel status"><div class="stats"><span>HP<b id="hpText">100</b></span><span>Score<b id="score">0</b></span><span>Wave<b id="wave">1</b></span><span>Targets<b id="targets">0</b></span></div><div class="hp-track"><div id="hpBar" class="hp-fill"></div></div></div><div class="actions"><button id="pause" class="icon">Ⅱ</button><button id="full" class="icon">⛶</button></div></div><div id="crosshair" class="crosshair"></div><div class="bottom"><div class="left-stack"><div id="weapons" class="panel weapons"></div><div class="move"><button id="left">←</button><button id="right">→</button></div></div><div class="fire-wrap"><span class="fire-ring"></span><button id="fire">FIRE</button></div></div></div><div id="damage" class="damage"></div><div id="pausedBadge" class="paused-badge">PAUSED</div><div id="toast" class="toast"></div>
<script type="module">
import * as THREE from 'three';import * as CANNON from 'cannon-es';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x86c9ee);scene.fog=new THREE.Fog(0x86c9ee,18,78);const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbfe8ff,0x233119,1.65));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(15,30,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});world.broadphase=new CANNON.SAPBroadphase(world);const material=new CANNON.Material('world');world.addContactMaterial(new CANNON.ContactMaterial(material,material,{friction:.58,restitution:.12}));const objects=[],targets=[],projectiles=[],particles=[];let score=0,hp=100,wave=1,paused=true,gameOver=false,started=false,yaw=0,pitch=0,aiming=false,lastX=0,lastY=0,shake=0,damageCooldown=0;const input={left:false,right:false};const defs=[['🔫','PISTOL',1,.16,48],['💥','SHOTGUN',8,.12,38],['💣','GRENADE',1,.34,29],['⚡','LASER',1,0,0],['🚀','ROCKET',1,.28,55]];let weapon=0;
function box(x,y,z,w,h,d,m,color,staticBody=false,target=false){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.76}));mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);const body=new CANNON.Body({mass:staticBody?0:m,material});body.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)));body.position.set(x,y,z);world.addBody(body);const o={mesh,body,target,alive:true};objects.push(o);if(target)targets.push(o);return o}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x365b20,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const fb=new CANNON.Body({mass:0,material});fb.addShape(new CANNON.Plane());fb.quaternion.setFromEuler(-Math.PI/2,0,0);world.addBody(fb);const player=new CANNON.Body({mass:60,material,fixedRotation:true,linearDamping:.88});player.addShape(new CANNON.Cylinder(.5,.5,1.8,8),new CANNON.Vec3(),new CANNON.Quaternion().setFromEuler(Math.PI/2,0,0));world.addBody(player);
const weaponEl=document.getElementById('weapons');defs.forEach((d,i)=>{const b=document.createElement('button');b.className='weapon'+(i?'':' active');b.innerHTML=`<strong>${d[0]}</strong>${d[1]}`;b.onclick=()=>{weapon=i;document.querySelectorAll('.weapon').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast(d[1])};weaponEl.appendChild(b)});
function updateHUD(){document.getElementById('hpText').textContent=Math.round(hp);document.getElementById('hpBar').style.width=hp+'%';document.getElementById('hpBar').style.background=hp<30?'#ff5445':hp<60?'#ffc14d':'#55e38c';document.getElementById('score').textContent=score;document.getElementById('wave').textContent=wave;document.getElementById('targets').textContent=targets.length}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1000)}function updateCamera(){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;camera.position.set(player.position.x,player.position.y+1.2,player.position.z)}
function spawnParticle(pos,color,size=.1,life=.4){const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,6,6),new THREE.MeshBasicMaterial({color,transparent:true}));mesh.position.copy(pos);scene.add(mesh);particles.push({mesh,life,max:life,v:new THREE.Vector3((Math.random()-.5)*5,Math.random()*5,(Math.random()-.5)*5)})}function burst(pos,color=0xff7b28,n=16){for(let i=0;i<n;i++)spawnParticle(pos,color,.05+Math.random()*.08,.25+Math.random()*.35)}
function removeProjectile(p){scene.remove(p.mesh);world.removeBody(p.body);const i=projectiles.indexOf(p);if(i>=0)projectiles.splice(i,1)}function destroy(o){if(!o||!o.alive)return;o.alive=false;score+=10;burst(o.mesh.position,0xffcf66,18);scene.remove(o.mesh);world.removeBody(o.body);let i=objects.indexOf(o);if(i>=0)objects.splice(i,1);i=targets.indexOf(o);if(i>=0)targets.splice(i,1);updateHUD();if(targets.length===0){wave++;toast('WAVE '+wave);spawnWave()}}
function explosion(pos,r=4){burst(pos);shake=.22;for(const o of [...targets])if(o.body.position.distanceTo(new CANNON.Vec3(pos.x,pos.y,pos.z))<r)destroy(o)}
function laser(){const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize(),start=camera.position.clone().addScaledVector(dir,1),rc=new THREE.Raycaster(start,dir,0,100),hits=rc.intersectObjects(targets.map(o=>o.mesh)),end=hits[0]?.point||start.clone().addScaledVector(dir,100);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.05,.1,end.distanceTo(start),8),new THREE.MeshBasicMaterial({color:0x00eaff}));beam.position.copy(start).lerp(end,.5);beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),end.clone().sub(start).normalize());scene.add(beam);setTimeout(()=>scene.remove(beam),80);if(hits[0]){destroy(targets.find(o=>o.mesh===hits[0].object));burst(hits[0].point,0x00eaff,12)}shake=.08}
function fire(){if(paused||gameOver)return;const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize(),start=camera.position.clone().addScaledVector(dir,1);if(weapon===3){laser();return}const count=defs[weapon][2];for(let i=0;i<count;i++){let d=dir.clone();if(count>1)d.add(new THREE.Vector3((Math.random()-.5)*.2,(Math.random()-.5)*.2,(Math.random()-.5)*.2)).normalize();const rad=defs[weapon][3],speed=defs[weapon][4],mesh=new THREE.Mesh(new THREE.SphereGeometry(Math.max(rad,.08),8,8),new THREE.MeshBasicMaterial({color:weapon===4?0xfff4d0:weapon===2?0xff4b3b:0xffff59}));mesh.position.copy(start);scene.add(mesh);const body=new CANNON.Body({mass:weapon===2?8:1,material});body.addShape(new CANNON.Sphere(Math.max(rad,.08)));body.position.set(start.x,start.y,start.z);body.velocity.set(d.x*speed,d.y*speed,d.z*speed);world.addBody(body);projectiles.push({mesh,body,life:2.6,explosive:weapon===2||weapon===4})}shake=.05}
function updateProjectiles(dt){for(const p of [...projectiles]){p.life-=dt;p.mesh.position.copy(p.body.position);if(p.life<=0||p.body.position.y<-.5||p.body.position.z<-70||p.body.position.z>30){if(p.explosive)explosion(p.body.position);removeProjectile(p);continue}for(const o of [...targets])if(o.alive&&p.body.position.distanceTo(o.body.position)<.9){if(p.explosive)explosion(p.body.position);else destroy(o);removeProjectile(p);break}}}
function updateEnemies(dt){damageCooldown=Math.max(0,damageCooldown-dt);for(const o of [...targets]){if(!o.alive)continue;o.mesh.rotation.y+=dt*.7;const dx=player.position.x-o.body.position.x,dz=player.position.z-o.body.position.z,d=Math.hypot(dx,dz);if(d<2.1){if(damageCooldown===0){hp-=10;damageCooldown=.65;const dfx=document.getElementById('damage');dfx.classList.remove('show');void dfx.offsetWidth;dfx.classList.add('show');updateHUD();if(hp<=0)endGame()}o.body.velocity.setZero()}else if(d<20){o.body.velocity.x=dx/d*1.3;o.body.velocity.z=dz/d*1.3}}}
function spawnWave(){for(let i=0;i<3+Math.min(wave,7);i++){const x=(Math.random()-.5)*14,z=-8-Math.random()*32;box(x,.8,z,1.25,1.6,1.25,3,0xd94c38,false,true)}updateHUD()}
function build(){for(const o of [...objects]){scene.remove(o.mesh);world.removeBody(o.body)}for(const p of [...projectiles])removeProjectile(p);objects.length=0;targets.length=0;projectiles.length=0;for(let r=0;r<7;r++)for(let c=0;c<13;c++)box(-6.6+c*1.1,.5+r*1.02,-15,1,.98,1,2,0xc47735,true,true);for(let i=0;i<16;i++){const x=(Math.random()<.5?-1:1)*(12+Math.random()*25),z=-35+Math.random()*58;box(x,1.2,z,.45,2.4,.45,0,0x7a4325,true);box(x,3,z,2.4,2.4,2.4,3,0x2f7d32)}player.position.set(0,1.1,15);player.velocity.setZero();score=0;hp=100;wave=1;gameOver=false;damageCooldown=0;spawnWave();updateHUD();updateCamera()}
function setPaused(v){paused=v;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';document.getElementById('pausedBadge').classList.toggle('show',paused&&started&&!gameOver)}function endGame(){gameOver=true;setPaused(true);document.getElementById('final').textContent=`Score ${score} · Wave ${wave}`;document.getElementById('over').classList.remove('hidden')}
function startGame(){started=true;document.getElementById('start').classList.add('hidden');build();setPaused(false);toast('GO!')}
document.getElementById('play').onclick=startGame;document.getElementById('restart').onclick=startGame;document.getElementById('pause').onclick=()=>{if(started&&!gameOver)setPaused(!paused)};document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{toast('Fullscreen unavailable')}};document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();fire()});
function hold(id,key){const e=document.getElementById(id),on=x=>{x.preventDefault();input[key]=true},off=x=>{x.preventDefault();input[key]=false};e.addEventListener('pointerdown',on);e.addEventListener('pointerup',off);e.addEventListener('pointercancel',off);e.addEventListener('pointerleave',off)}hold('left','left');hold('right','right');renderer.domElement.addEventListener('pointerdown',e=>{if(paused||gameOver)return;aiming=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointermove',e=>{if(!aiming)return;yaw-=(e.clientX-lastX)*.004;pitch-=(e.clientY-lastY)*.004;pitch=Math.max(-1.35,Math.min(1.35,pitch));lastX=e.clientX;lastY=e.clientY;updateCamera()});addEventListener('pointerup',()=>aiming=false);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();fire()}if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')input.right=true;if(e.code==='Escape'&&started)setPaused(!paused)});addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')input.right=false});
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(!paused&&!gameOver){const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),yaw),f=new CANNON.Vec3();if(input.left){f.x-=right.x*95;f.z-=right.z*95}if(input.right){f.x+=right.x*95;f.z+=right.z*95}if(f.length()>0)player.applyForce(f);player.velocity.y=Math.max(player.velocity.y,-18);world.step(1/60);updateCamera();updateProjectiles(dt);updateEnemies(dt);for(const o of objects)o.mesh.position.copy(o.body.position)}for(const p of [...particles]){p.life-=dt;p.mesh.position.x+=p.v.x*dt;p.mesh.position.y+=p.v.y*dt;p.mesh.position.z+=p.v.z*dt;p.v.y-=7*dt;p.mesh.material.opacity=Math.max(0,p.life/p.max);if(p.life<=0){scene.remove(p.mesh);particles.splice(particles.indexOf(p),1)}}if(shake>0){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt)}renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight)});build();updateCamera();requestAnimationFrame(loop);
</script></body></html>
