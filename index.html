<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>Rock Shooter</title>
<style>
:root{--glass:rgba(8,11,16,.68);--line:rgba(255,255,255,.14);--text:#fff;--muted:#aeb7c4;--accent:#ff4d32}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;z-index:5;pointer-events:none}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.panel{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:10px 13px;box-shadow:0 10px 30px #0006}.stats{display:flex;gap:14px;font-size:12px}.stats b{display:block;font-size:17px;margin-top:2px}.health{width:min(210px,48vw)}.bar{height:6px;background:#ffffff18;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:100%;background:#52e38a;border-radius:9px}.actions{display:flex;gap:7px;pointer-events:auto}.icon{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:#ffffff0c;color:#fff;font-size:18px}.crosshair{position:fixed;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);border:2px solid #fff9;border-radius:50%;z-index:4;pointer-events:none}.crosshair:after{content:"";position:absolute;width:5px;height:5px;left:50%;top:50%;transform:translate(-50%,-50%);background:#ff4d32;border-radius:50%;box-shadow:0 0 12px #ff4d32}.bottom{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.weapons{display:flex;gap:7px;max-width:65vw;overflow:auto;padding:7px;pointer-events:auto}.weapon{min-width:52px;height:58px;border:1px solid var(--line);border-radius:15px;background:#ffffff0b;color:#fff;font-size:11px}.weapon strong{display:block;font-size:20px}.weapon.active{border-color:#fff;background:#fff1;box-shadow:0 0 18px #fff2}.move{display:flex;gap:8px;pointer-events:auto}.move button{width:62px;height:62px;border:1px solid #fff3;border-radius:20px;background:#ffffff12;color:#fff;font-size:27px;backdrop-filter:blur(12px)}#fire{pointer-events:auto;width:92px;height:92px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#ff704f,#a91508 70%);color:#fff;font-weight:900;box-shadow:0 0 28px #ff3d2680;font-size:15px}#fire:active{transform:scale(.92)}.center{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:#05070bdd;backdrop-filter:blur(12px);text-align:center;padding:24px}.card{max-width:420px;background:#0d1118eF;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 30px 80px #0009}.card h1{margin:0 0 8px;font-size:34px}.card p{color:var(--muted);line-height:1.5}.primary{border:0;border-radius:15px;padding:14px 22px;background:#fff;color:#080b10;font-weight:800;font-size:15px}.hidden{display:none!important}.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:30;background:#111823ee;border:1px solid var(--line);padding:9px 13px;border-radius:13px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:600px){.health{width:145px}.stats{gap:9px}.bottom{gap:7px}.move button{width:55px;height:55px}.weapons{max-width:58vw}.weapon{min-width:48px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
</head>
<body>
<div id="start" class="center"><div class="card"><h1>ROCK SHOOTER</h1><p>Destroy the wall, survive the waves and test every weapon.</p><button id="play" class="primary">PLAY GAME</button></div></div>
<div id="over" class="center hidden"><div class="card"><h1>GAME OVER</h1><p id="final"></p><button id="restart" class="primary">PLAY AGAIN</button></div></div>
<div class="hud"><div class="top"><div class="panel health"><div class="stats"><span>HP<b id="hpText">100</b></span><span>SCORE<b id="score">0</b></span><span>WAVE<b id="wave">1</b></span></div><div class="bar"><i id="hpBar"></i></div></div><div class="actions"><button class="icon" id="pause">Ⅱ</button><button class="icon" id="full">⛶</button></div></div><div class="crosshair"></div><div class="bottom"><div><div class="panel weapons" id="weapons"></div><div class="move"><button id="left">←</button><button id="right">→</button></div></div><button id="fire">FIRE</button></div></div>
<div id="toast" class="toast"></div>
<script type="module">
import * as THREE from 'three';import * as CANNON from 'cannon-es';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x86c9ee);scene.fog=new THREE.Fog(0x86c9ee,18,75);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,140);camera.position.set(0,2.2,15);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfe7ff,0x263019,1.6));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(15,28,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});world.broadphase=new CANNON.SAPBroadphase(world);const material=new CANNON.Material('world');world.addContactMaterial(new CANNON.ContactMaterial(material,material,{friction:.55,restitution:.12}));
const objects=[];const targets=[];const projectiles=[];let score=0,hp=100,wave=1,paused=true,gameOver=false,yaw=0,pitch=0,aiming=false,lastX=0,lastY=0;const input={left:false,right:false};
function box(x,y,z,w,h,d,m,color,staticBody=false,target=false){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.78}));mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);const body=new CANNON.Body({mass:staticBody?0:m,material});body.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)));body.position.set(x,y,z);world.addBody(body);const o={mesh,body,target};objects.push(o);if(target)targets.push(o);return o}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x365b20,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const fb=new CANNON.Body({mass:0,material});fb.addShape(new CANNON.Plane());fb.quaternion.setFromEuler(-Math.PI/2,0,0);world.addBody(fb);
const player=new CANNON.Body({mass:60,material,fixedRotation:true,linearDamping:.88});player.addShape(new CANNON.Cylinder(.5,.5,1.8,8),new CANNON.Vec3(),new CANNON.Quaternion().setFromEuler(Math.PI/2,0,0));player.position.set(0,1.1,15);world.addBody(player);
const defs=[['🔫','PISTOL',1,.16,48],['💥','SHOTGUN',8,.12,38],['💣','GRENADE',1,.34,28],['⚡','LASER',1,0,0],['🚀','ROCKET',1,.28,55]];let weapon=0;const weaponEl=document.getElementById('weapons');defs.forEach((d,i)=>{const b=document.createElement('button');b.className='weapon'+(i===0?' active':'');b.innerHTML=`<strong>${d[0]}</strong>${d[1]}`;b.onclick=()=>{weapon=i;document.querySelectorAll('.weapon').forEach(x=>x.classList.remove('active'));b.classList.add('active')};weaponEl.appendChild(b)});
function build(){for(const o of [...objects]){scene.remove(o.mesh);world.removeBody(o.body)}objects.length=0;targets.length=0;for(let r=0;r<7;r++)for(let c=0;c<13;c++)box(-6.6+c*1.1,.5+r*1.02,-15,1,.98,1,2,0xc47735,true,true);for(let i=0;i<14;i++){const x=(Math.random()<.5?-1:1)*(12+Math.random()*25),z=-35+Math.random()*55;box(x,1.2,z,.45,2.4,.45,0,0x7a4325,true);box(x,3,z,2.4,2.4,2.4,3,0x2f7d32)}player.position.set(0,1.1,15);player.velocity.setZero();hp=100;score=0;wave=1;gameOver=false;document.getElementById('over').classList.add('hidden');updateHUD()}
function updateHUD(){hp=Math.max(0,hp);document.getElementById('hpText').textContent=Math.round(hp);document.getElementById('hpBar').style.width=hp+'%';document.getElementById('score').textContent=score;document.getElementById('wave').textContent=wave}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1100)}
function removeProjectile(p){scene.remove(p.mesh);world.removeBody(p.body);const i=projectiles.indexOf(p);if(i>=0)projectiles.splice(i,1)}
function explosion(pos,r=5){const g=new THREE.SphereGeometry(.5,16,12),m=new THREE.MeshBasicMaterial({color:0xff6a22,transparent:true,opacity:.8});const e=new THREE.Mesh(g,m);e.position.copy(pos);scene.add(e);let s=.5;const id=setInterval(()=>{s+=.65;e.scale.setScalar(s);m.opacity-=.1;if(m.opacity<=0){clearInterval(id);scene.remove(e)}},25);for(const o of objects){if(!o.target||o.body.mass===0)continue;const d=o.body.position.distanceTo(new CANNON.Vec3(pos.x,pos.y,pos.z));if(d<r){o.body.wakeUp();const f=o.body.position.vsub(new CANNON.Vec3(pos.x,pos.y,pos.z));f.normalize();f.scale(80*(1-d/r),f);o.body.applyImpulse(f)}}}
function fire(){if(paused||gameOver)return;const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize(),start=camera.position.clone().addScaledVector(dir,1);if(weapon===3){const rc=new THREE.Raycaster(start,dir,0,100);const hits=rc.intersectObjects(objects.filter(o=>o.target).map(o=>o.mesh));if(hits[0]){const o=objects.find(x=>x.mesh===hits[0].object);destroy(o);explosion(hits[0].point,3)}toast('LASER HIT');return}const count=defs[weapon][2];for(let i=0;i<count;i++){let d=dir.clone();if(count>1)d.add(new THREE.Vector3((Math.random()-.5)*.18,(Math.random()-.5)*.18,(Math.random()-.5)*.18)).normalize();const rad=defs[weapon][3],speed=defs[weapon][4];const mesh=new THREE.Mesh(new THREE.SphereGeometry(Math.max(rad,.08),8,8),new THREE.MeshBasicMaterial({color:weapon===4?0x00eaff:weapon===2?0xff392b:0xffff55}));mesh.position.copy(start);scene.add(mesh);const body=new CANNON.Body({mass:weapon===2?8:1,material});body.addShape(new CANNON.Sphere(Math.max(rad,.08)));body.position.set(start.x,start.y,start.z);body.velocity.set(d.x*speed,d.y*speed,d.z*speed);world.addBody(body);projectiles.push({mesh,body,life:2.5,explosive:weapon===2||weapon===4})}}
function destroy(o){if(!o||!o.body)return;score+=10;const i=objects.indexOf(o);if(i>=0)objects.splice(i,1);const t=targets.indexOf(o);if(t>=0)targets.splice(t,1);scene.remove(o.mesh);world.removeBody(o.body);updateHUD();if(targets.length<18+wave*2){wave++;spawnWave();updateHUD()}}
function spawnWave(){for(let i=0;i<3+wave;i++){const x=(Math.random()-.5)*15,z=-10-Math.random()*28;box(x,.8,z,1.2,1.6,1.2,3,0xd94c38,false,true)}}
function updateCamera(){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;camera.position.set(player.position.x,player.position.y+1.2,player.position.z)}
function bindHold(id,key){const e=document.getElementById(id);const on=x=>{x.preventDefault();input[key]=true},off=x=>{x.preventDefault();input[key]=false};e.addEventListener('pointerdown',on);e.addEventListener('pointerup',off);e.addEventListener('pointercancel',off);e.addEventListener('pointerleave',off)}bindHold('left','left');bindHold('right','right');
document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();fire()});
renderer.domElement.addEventListener('pointerdown',e=>{if(paused||gameOver)return;aiming=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointermove',e=>{if(!aiming)return;yaw-=(e.clientX-lastX)*.004;pitch-=(e.clientY-lastY)*.004;pitch=Math.max(-1.35,Math.min(1.35,pitch));lastX=e.clientX;lastY=e.clientY;updateCamera()});addEventListener('pointerup',()=>aiming=false);
function endGame(){gameOver=true;paused=true;document.getElementById('final').textContent=`Score ${score} · Wave ${wave}`;document.getElementById('over').classList.remove('hidden')}
function loop(){requestAnimationFrame(loop);if(!paused&&!gameOver){const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),yaw),right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const f=new CANNON.Vec3();if(input.left)f.vsub(new CANNON.Vec3(right.x*90,0,right.z*90),f);if(input.right)f.vadd(new CANNON.Vec3(right.x*90,0,right.z*90),f);if(f.length()>0)player.applyForce(f);player.velocity.y=Math.max(player.velocity.y,-18);world.step(1/60);updateCamera();for(const p of [...projectiles]){p.life-=1/60;if(p.life<=0){removeProjectile(p);continue}p.mesh.position.copy(p.body.position);for(const o of [...objects])if(o.target&&p.body.position.distanceTo(o.body.position)<1.0){if(p.explosive)explosion(p.body.position,4);destroy(o);removeProjectile(p);break}}for(const o of targets){if(o.body.mass>0&&o.body.position.y<-.5){destroy(o)}}if(player.position.y<-.5){hp=0;updateHUD();endGame()}if(Math.random()<.0009*wave){hp-=2;updateHUD();if(hp<=0)endGame()}}renderer.render(scene,camera)}
document.getElementById('play').onclick=()=>{paused=false;document.getElementById('start').classList.add('hidden');toast('WAVE 1')};document.getElementById('restart').onclick=()=>{build();paused=false};document.getElementById('pause').onclick=()=>{if(gameOver)return;paused=!paused;toast(paused?'PAUSED':'RESUMED')};document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
build();updateCamera();loop();
</script></body></html>
