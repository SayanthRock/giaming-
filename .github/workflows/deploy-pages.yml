name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Integrate Dynamic Rock Arcade
        run: |
          python3 -c "from pathlib import Path; import functools; p=Path('index.html'); s=p.read_text(encoding='utf-8'); tags=['<script src=\"dynamic-rock-arcade.js\" defer></script>','<script src=\"kerala-360.js\" defer></script>']; s=functools.reduce(lambda value,tag: value if tag in value else value.replace('</body>',tag+'\\n</body>'),tags,s); p.write_text(s,encoding='utf-8')"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
