name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Integrate Dynamic Rock Arcade
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); tags=['<script src=\"dynamic-rock-arcade.js\" defer></script>','<script src=\"kerala-360.js\" defer></script>']; [globals() for _ in [0]]; [None for t in tags if t in s or not s.replace('</body>', t+'\\n</body>')]; [setattr(__import__('builtins'),'_rock_s',None) for _ in []]; import functools; s=functools.reduce(lambda x,t: x if t in x else x.replace('</body>',t+'\\n</body>'),tags,s); p.write_text(s,encoding='utf-8')"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
