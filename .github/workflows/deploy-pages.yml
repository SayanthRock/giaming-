name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Integrate Rock cartoon arcade style
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); tag='<script src=\"rock-cartoon-arcade.js\" defer></script>'; p.write_text(s if tag in s else s.replace('</body>',tag+'\\n</body>'),encoding='utf-8')"

      - name: Integrate Rock arcade interaction feedback
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); tag='<script src=\"rock-interaction-arcade.js\" defer></script>'; p.write_text(s if tag in s else s.replace('</body>',tag+'\\n</body>'),encoding='utf-8')"

      - name: Integrate Kerala arcade world
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); tag='<script src=\"kerala-arcade-world.js\" defer></script>'; p.write_text(s if tag in s else s.replace('</body>',tag+'\\n</body>'),encoding='utf-8')"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
